<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plasma Disc Brawl: PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; background-color: #09090b; }
        kbd { font-family: monospace; }
    </style>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col items-center justify-center p-4 selection:bg-cyan-500/30 relative">

    <!-- Background Ambient Glow -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-cyan-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-pink-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Top Bar -->
    <div class="w-full max-w-[1000px] flex justify-between items-center mb-6 px-8 z-10">
        <!-- Player Stats -->
        <div class="flex flex-col items-start w-48">
            <div class="flex items-end gap-3">
                <span id="player-score-el" class="text-sky-400 font-black text-6xl tracking-tighter drop-shadow-[0_0_15px_rgba(14,165,233,0.8)]">0</span>
                <span class="text-zinc-400 text-sm font-bold tracking-widest uppercase mb-2">Player</span>
            </div>
            <div class="w-full h-2 bg-zinc-900 rounded-full mt-2 overflow-hidden border border-zinc-800">
                <div id="player-energy-el" class="h-full bg-sky-400 shadow-[0_0_10px_#0ea5e9] transition-all duration-75" style="width: 100%"></div>
            </div>
        </div>
        
        <!-- Center Title -->
        <div class="flex flex-col items-center">
            <h1 class="text-3xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-b from-white to-zinc-500 uppercase italic drop-shadow-lg">
                Plasma Disc <span class="text-yellow-400">PRO</span>
            </h1>
            <span class="text-zinc-500 text-xs tracking-widest mt-1 bg-zinc-900/50 px-3 py-1 rounded-full border border-zinc-800">FIRST TO 7</span>
        </div>

        <!-- AI Stats -->
        <div class="flex flex-col items-end w-48">
            <div class="flex items-end gap-3 flex-row-reverse">
                <span id="ai-score-el" class="text-pink-500 font-black text-6xl tracking-tighter drop-shadow-[0_0_15px_rgba(236,72,153,0.8)]">0</span>
                <span class="text-zinc-400 text-sm font-bold tracking-widest uppercase mb-2">CPU</span>
            </div>
            <div class="w-full h-2 bg-zinc-900 rounded-full mt-2 overflow-hidden border border-zinc-800 flex justify-end">
                <div id="ai-energy-el" class="h-full bg-pink-500 shadow-[0_0_10px_#ec4899] transition-all duration-75" style="width: 100%"></div>
            </div>
        </div>
    </div>

    <!-- Game Container -->
    <div class="relative rounded-2xl overflow-hidden border border-zinc-700 shadow-[0_0_80px_rgba(0,0,0,0.8)] bg-[#0a0a0f] z-10 ring-4 ring-black/50 w-full max-w-[1000px] aspect-[5/3]">
        <canvas id="gameCanvas" width="1000" height="600" class="block w-full h-full"></canvas>

        <!-- CRT Scanlines Overlay -->
        <div class="absolute inset-0 pointer-events-none bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.25)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] bg-[length:100%_4px,3px_100%] z-10 opacity-30"></div>
        <div class="absolute inset-0 pointer-events-none shadow-[inset_0_0_150px_rgba(0,0,0,0.9)] z-10"></div>

        <!-- Audio Toggle -->
        <button id="mute-btn" class="absolute top-4 right-4 z-30 p-2 bg-black/50 hover:bg-black/80 border border-zinc-700 rounded-full text-zinc-400 hover:text-white transition-colors backdrop-blur-md">
            <svg id="icon-vol-on" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
            <svg id="icon-vol-off" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        </button>

        <!-- Menu Overlay -->
        <div id="menu-screen" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-black/60 backdrop-blur-md">
            <div class="bg-zinc-950/80 border border-zinc-700/50 p-10 rounded-3xl text-center max-w-lg shadow-[0_0_50px_rgba(0,0,0,0.5)] backdrop-blur-xl">
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-sky-400 mx-auto mb-6 drop-shadow-[0_0_15px_rgba(14,165,233,0.8)]"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                <h2 class="text-4xl font-black mb-4 uppercase italic tracking-tight text-white">Pro Arena</h2>
                
                <div class="grid grid-cols-2 gap-4 text-left mb-8">
                    <div class="bg-black/40 p-4 rounded-xl border border-zinc-800/50">
                        <div class="text-sky-400 font-bold mb-1 text-sm uppercase">Movement</div>
                        <div class="text-zinc-300 text-sm">WASD / Arrows</div>
                    </div>
                    <div class="bg-black/40 p-4 rounded-xl border border-zinc-800/50">
                        <div class="text-yellow-400 font-bold mb-1 text-sm uppercase">Curve Shot</div>
                        <div class="text-zinc-300 text-sm">Move Up/Down while hitting</div>
                    </div>
                    <div class="bg-black/40 p-4 rounded-xl border border-zinc-800/50 col-span-2">
                        <div class="text-red-400 font-bold mb-1 text-sm uppercase flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg> Hyper Strike
                        </div>
                        <div class="text-zinc-300 text-sm">Hold <kbd class="bg-zinc-800 px-2 py-0.5 rounded text-xs">SPACE</kbd> to spend energy and dash. Hit the disc while dashing for a massive speed boost.</div>
                    </div>
                </div>

                <button id="start-btn" class="w-full py-5 bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-black text-xl rounded-xl flex items-center justify-center gap-3 transition-all hover:scale-105 active:scale-95 shadow-[0_0_30px_rgba(14,165,233,0.4)] border border-sky-400/30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> START MATCH
                </button>
            </div>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameover-screen" class="hidden absolute inset-0 z-20 flex flex-col items-center justify-center bg-black/80 backdrop-blur-lg">
            <div id="gameover-card" class="border p-10 rounded-3xl text-center max-w-lg shadow-2xl backdrop-blur-xl">
                <div id="gameover-icon-container" class="flex justify-center mb-6"></div>
                <h2 id="gameover-title" class="text-5xl font-black mb-4 uppercase italic tracking-tighter"></h2>
                <p id="gameover-desc" class="text-zinc-300 mb-10 text-xl font-light"></p>
                
                <button id="rematch-btn" class="w-full py-5 bg-white hover:bg-zinc-200 text-zinc-900 font-black text-xl rounded-xl flex items-center justify-center gap-3 transition-all hover:scale-105 active:scale-95 shadow-[0_0_30px_rgba(255,255,255,0.2)]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg> PLAY AGAIN
                </button>
            </div>
        </div>
    </div>
    
    <div class="mt-8 text-zinc-600 text-sm tracking-widest uppercase font-bold z-10 flex items-center gap-4">
        <span>Plasma Disc PRO © 2026</span>
        <span class="w-1 h-1 bg-zinc-600 rounded-full"></span>
        <span>Audio Engine Active</span>
    </div>

    <script>
        // --- Audio Engine ---
        class AudioEngine {
            constructor() {
                this.ctx = null; this.isPlaying = false; this.masterGain = null;
                this.musicInterval = null; this.step = 0; this.muted = false;
            }
            init() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.4;
                this.masterGain.connect(this.ctx.destination);
            }
            toggleMute() {
                this.muted = !this.muted;
                if (this.masterGain) this.masterGain.gain.setTargetAtTime(this.muted ? 0 : 0.4, this.ctx.currentTime, 0.1);
                return this.muted;
            }
            playHit(type) {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.masterGain);
                const now = this.ctx.currentTime;
                if (type === 'paddle') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'wall') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                    gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                }
            }
            playScore() {
                if (!this.ctx || this.muted) return;
                const now = this.ctx.currentTime;
                [400, 600, 800].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.type = 'sine'; osc.frequency.value = freq;
                    osc.connect(gain); gain.connect(this.masterGain);
                    gain.gain.setValueAtTime(0, now + i * 0.1); gain.gain.linearRampToValueAtTime(0.3, now + i * 0.1 + 0.05); gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                    osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.3);
                });
            }
            startMusic() {
                if (!this.ctx || this.isPlaying) return;
                this.isPlaying = true;
                const stepTime = (60 / 125) / 4;
                const bassPattern = [32.70, 0, 32.70, 0, 32.70, 32.70, 0, 38.89, 32.70, 0, 32.70, 0, 41.20, 0, 38.89, 0];
                this.musicInterval = setInterval(() => {
                    if (!this.isPlaying || !this.ctx || this.muted) return;
                    const now = this.ctx.currentTime;
                    if (this.step % 4 === 0) {
                        const kickOsc = this.ctx.createOscillator(); const kickGain = this.ctx.createGain();
                        kickOsc.connect(kickGain); kickGain.connect(this.masterGain);
                        kickOsc.frequency.setValueAtTime(150, now); kickOsc.frequency.exponentialRampToValueAtTime(0.01, now + 0.5);
                        kickGain.gain.setValueAtTime(0.8, now); kickGain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                        kickOsc.start(now); kickOsc.stop(now + 0.5);
                    }
                    const freq = bassPattern[this.step % 16];
                    if (freq > 0) {
                        const bassOsc = this.ctx.createOscillator(); const bassGain = this.ctx.createGain(); const filter = this.ctx.createBiquadFilter();
                        bassOsc.type = 'sawtooth'; bassOsc.frequency.value = freq;
                        filter.type = 'lowpass'; filter.frequency.setValueAtTime(200, now); filter.frequency.exponentialRampToValueAtTime(1000, now + 0.05); filter.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                        bassGain.gain.setValueAtTime(0.3, now); bassGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        bassOsc.connect(filter); filter.connect(bassGain); bassGain.connect(this.masterGain);
                        bassOsc.start(now); bassOsc.stop(now + 0.2);
                    }
                    this.step++;
                }, stepTime * 1000);
            }
            stopMusic() {
                this.isPlaying = false;
                if (this.musicInterval) clearInterval(this.musicInterval);
            }
        }

        const audio = new AudioEngine();

        // --- Game Logic ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const CANVAS_WIDTH = 1000;
        const CANVAS_HEIGHT = 600;
        const WINNING_SCORE = 7;

        let gameState = 'menu'; // menu, playing, gameover
        let pScore = 0, aScore = 0;
        let animationId, lastTime = 0, hitPause = 0, screenShake = 0, gridOffset = 0;
        const keys = { w: false, s: false, a: false, d: false, space: false };

        window.addEventListener('keydown', e => {
            if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.w = true;
            if (['ArrowDown', 's', 'S'].includes(e.key)) keys.s = true;
            if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.a = true;
            if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.d = true;
            if (e.key === ' ') { e.preventDefault(); keys.space = true; }
        });
        window.addEventListener('keyup', e => {
            if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.w = false;
            if (['ArrowDown', 's', 'S'].includes(e.key)) keys.s = false;
            if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.a = false;
            if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.d = false;
            if (e.key === ' ') keys.space = false;
        });

        class Paddle {
            constructor(x, color, isPlayer) {
                this.x = x; this.y = CANVAS_HEIGHT / 2 - 50; this.width = 18; this.height = 100;
                this.color = color; this.speed = 7; this.vy = 0; this.vx = 0;
                this.isPlayer = isPlayer; this.energy = 100; this.isDashing = false;
            }
            update(dt) {
                this.isDashing = false;
                this.energy = Math.min(100, this.energy + 0.15);
                if (this.isPlayer) {
                    this.vy = 0; this.vx = 0;
                    let currentSpeed = this.speed;
                    if (keys.space && this.energy >= 2) {
                        this.isDashing = true; this.energy -= 2; currentSpeed = this.speed * 2.2;
                        createParticles(this.x + this.width/2, this.y + this.height/2, this.color, 2, 2);
                    }
                    if (keys.w) this.vy = -currentSpeed;
                    if (keys.s) this.vy = currentSpeed;
                    if (keys.a) this.vx = -currentSpeed;
                    if (keys.d) this.vx = currentSpeed;
                    document.getElementById('player-energy-el').style.width = `${this.energy}%`;
                } else {
                    const targetY = disc.y - this.height / 2;
                    const predictedY = disc.y + (disc.vy * 10) + (disc.spin * 50);
                    const pDiff = predictedY - this.y - this.height/2;
                    let currentSpeed = this.speed * 0.9;
                    if (Math.abs(disc.vx) > 12 && disc.x > CANVAS_WIDTH / 2 && this.energy > 30) {
                        this.isDashing = true; this.energy -= 2; currentSpeed *= 2;
                        createParticles(this.x + this.width/2, this.y + this.height/2, this.color, 2, 2);
                    }
                    if (Math.abs(pDiff) > 10) this.vy = Math.sign(pDiff) * Math.min(Math.abs(pDiff), currentSpeed);
                    else this.vy *= 0.8;
                    this.vx = ((CANVAS_WIDTH - 60) - this.x) * 0.1;
                    document.getElementById('ai-energy-el').style.width = `${this.energy}%`;
                }
                this.y += this.vy; this.x += this.vx;
                if (this.y < 0) this.y = 0;
                if (this.y > CANVAS_HEIGHT - this.height) this.y = CANVAS_HEIGHT - this.height;
                if (this.isPlayer) {
                    if (this.x < 20) this.x = 20;
                    if (this.x > CANVAS_WIDTH / 2 - 60) this.x = CANVAS_WIDTH / 2 - 60;
                } else {
                    if (this.x > CANVAS_WIDTH - 38) this.x = CANVAS_WIDTH - 38;
                    if (this.x < CANVAS_WIDTH / 2 + 60) this.x = CANVAS_WIDTH / 2 + 60;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.shadowBlur = this.isDashing ? 30 : 15; ctx.shadowColor = this.color; ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.roundRect(this.x, this.y, this.width, this.height, 8); ctx.fill();
                const coreHeight = (this.height - 10) * (this.energy / 100);
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 0; ctx.beginPath();
                ctx.roundRect(this.x + 4, this.y + 5 + ((this.height - 10) - coreHeight), this.width - 8, coreHeight, 4); ctx.fill();
                if (this.isDashing) {
                    ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, this.height * 0.6, -Math.PI/2, Math.PI/2, !this.isPlayer); ctx.stroke();
                }
                ctx.restore();
            }
        }

        class Disc {
            constructor() {
                this.radius = 14; this.baseSpeed = 9; this.reset(1);
            }
            reset(direction) {
                this.x = CANVAS_WIDTH / 2; this.y = CANVAS_HEIGHT / 2;
                this.vx = direction * this.baseSpeed; this.vy = (Math.random() - 0.5) * 4;
                this.isSuper = false; this.spin = 0; this.color = '#eab308'; this.trail = [];
            }
            update() {
                this.vy += this.spin; this.spin *= 0.98;
                this.x += this.vx; this.y += this.vy;
                this.trail.unshift({ x: this.x, y: this.y, alpha: 1, color: this.color });
                if (this.trail.length > 20) this.trail.pop();
                this.trail.forEach(t => t.alpha -= 0.05);
                if (this.y < this.radius || this.y > CANVAS_HEIGHT - this.radius) {
                    this.y = this.y < this.radius ? this.radius : CANVAS_HEIGHT - this.radius;
                    this.vy *= -1; this.spin *= -0.5;
                    createParticles(this.x, this.y, this.color, 8, 3); audio.playHit('wall'); screenShake = 2;
                }
                this.checkPaddleCollision(player); this.checkPaddleCollision(ai);
                if (this.x < -50) scorePoint('AI'); else if (this.x > CANVAS_WIDTH + 50) scorePoint('Player');
            }
            checkPaddleCollision(paddle) {
                const testX = this.x < paddle.x ? paddle.x : this.x > paddle.x + paddle.width ? paddle.x + paddle.width : this.x;
                const testY = this.y < paddle.y ? paddle.y : this.y > paddle.y + paddle.height ? paddle.y + paddle.height : this.y;
                const distance = Math.sqrt(Math.pow(this.x - testX, 2) + Math.pow(this.y - testY, 2));
                if (distance <= this.radius) {
                    const hitPoint = (this.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
                    this.vx = paddle.isPlayer ? Math.abs(this.vx) : -Math.abs(this.vx);
                    this.spin = paddle.vy * 0.15;
                    if (paddle.isDashing) {
                        this.isSuper = true; this.color = paddle.isPlayer ? '#ef4444' : '#a855f7';
                        this.vx *= 1.6; this.vy = hitPoint * 12 + (paddle.vy * 0.8);
                        screenShake = 12; hitPause = 4;
                        createParticles(this.x, this.y, this.color, 30, 8); createRing(this.x, this.y, this.color); audio.playHit('super');
                    } else {
                        this.isSuper = false; this.color = '#eab308';
                        this.vx = Math.sign(this.vx) * (this.baseSpeed + Math.abs(paddle.vx) * 0.6);
                        this.vy = hitPoint * 8 + (paddle.vy * 0.5);
                        screenShake = 4; createParticles(this.x, this.y, '#eab308', 15, 4); audio.playHit('paddle');
                    }
                    this.x = paddle.isPlayer ? paddle.x + paddle.width + this.radius : paddle.x - this.radius;
                }
            }
            draw(ctx) {
                ctx.save();
                this.trail.forEach((t, i) => {
                    if (t.alpha <= 0) return;
                    ctx.globalAlpha = t.alpha * 0.6; ctx.shadowBlur = this.isSuper ? 25 : 10; ctx.shadowColor = t.color; ctx.fillStyle = t.color;
                    ctx.beginPath(); ctx.arc(t.x, t.y, this.radius * (1 - i/this.trail.length), 0, Math.PI*2); ctx.fill();
                });
                ctx.globalAlpha = 1; ctx.shadowBlur = this.isSuper ? 40 : 20; ctx.shadowColor = this.color; ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = this.color; const spinAngle = Date.now() / 50 * (this.spin || 1);
                ctx.beginPath(); ctx.arc(this.x + Math.cos(spinAngle) * 6, this.y + Math.sin(spinAngle) * 6, 4, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, speedMult) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2; const speed = (Math.random() * 5 + 2) * speedMult;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.life = 1; this.size = Math.random() * 4 + 2;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= 0.02; }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color; ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
            }
        }

        class Ring {
            constructor(x, y, color) { this.x = x; this.y = y; this.radius = 10; this.life = 1; this.color = color; }
            update() { this.radius += 8; this.life -= 0.05; }
            draw(ctx) {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.life); ctx.strokeStyle = this.color; ctx.lineWidth = 4 * this.life;
                ctx.shadowBlur = 20; ctx.shadowColor = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.stroke(); ctx.restore();
            }
        }

        let player = new Paddle(40, '#0ea5e9', true);
        let ai = new Paddle(CANVAS_WIDTH - 58, '#ec4899', false);
        let disc = new Disc();
        let particles = [], rings = [];

        function createParticles(x, y, color, count, speedMult = 1) { for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color, speedMult)); }
        function createRing(x, y, color) { rings.push(new Ring(x, y, color)); }

        function scorePoint(scorer) {
            createParticles(disc.x, disc.y, scorer === 'Player' ? '#0ea5e9' : '#ec4899', 80, 5);
            createRing(disc.x, disc.y, scorer === 'Player' ? '#0ea5e9' : '#ec4899');
            screenShake = 25; audio.playScore();
            
            if (scorer === 'Player') { pScore++; document.getElementById('player-score-el').innerText = pScore; disc.reset(-1); } 
            else { aScore++; document.getElementById('ai-score-el').innerText = aScore; disc.reset(1); }

            if (pScore >= WINNING_SCORE || aScore >= WINNING_SCORE) {
                gameState = 'gameover';
                const isPlayerWin = pScore >= WINNING_SCORE;
                document.getElementById('gameover-screen').classList.remove('hidden');
                document.getElementById('gameover-card').className = `border p-10 rounded-3xl text-center max-w-lg shadow-2xl backdrop-blur-xl ${isPlayerWin ? 'bg-sky-950/40 border-sky-500/50 shadow-sky-900/50' : 'bg-pink-950/40 border-pink-500/50 shadow-pink-900/50'}`;
                document.getElementById('gameover-title').innerText = isPlayerWin ? 'VICTORY' : 'DEFEAT';
                document.getElementById('gameover-title').className = `text-5xl font-black mb-4 uppercase italic tracking-tighter ${isPlayerWin ? 'text-sky-400' : 'text-pink-500'}`;
                document.getElementById('gameover-desc').innerText = isPlayerWin ? 'You are the Arena Champion.' : 'The CPU outplayed you.';
                document.getElementById('gameover-icon-container').innerHTML = isPlayerWin 
                    ? '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-sky-400 drop-shadow-[0_0_20px_rgba(14,165,233,0.8)]"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>'
                    : '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-pink-500 drop-shadow-[0_0_20px_rgba(236,72,153,0.8)]"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>';
            }
        }

        function update(dt) {
            if (hitPause > 0) { hitPause--; return; }
            player.update(dt); ai.update(dt); disc.update();
            for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); if (particles[i].life <= 0) particles.splice(i, 1); }
            for (let i = rings.length - 1; i >= 0; i--) { rings[i].update(); if (rings[i].life <= 0) rings.splice(i, 1); }
            if (screenShake > 0) screenShake *= 0.85; if (screenShake < 0.5) screenShake = 0;
            gridOffset = (gridOffset + 2) % 40;
        }

        function draw() {
            const bgGradient = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
            bgGradient.addColorStop(0, '#0f0c29'); bgGradient.addColorStop(0.5, '#302b63'); bgGradient.addColorStop(1, '#24243e');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.save();
            if (screenShake > 0) { ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake); }
            
            ctx.strokeStyle = 'rgba(14, 165, 233, 0.15)'; ctx.lineWidth = 2; ctx.beginPath();
            for (let y = 0; y <= CANVAS_HEIGHT; y += 40) { ctx.moveTo(0, y + (gridOffset * (y/CANVAS_HEIGHT))); ctx.lineTo(CANVAS_WIDTH, y + (gridOffset * (y/CANVAS_HEIGHT))); }
            for (let x = -CANVAS_WIDTH; x <= CANVAS_WIDTH * 2; x += 80) { ctx.moveTo(CANVAS_WIDTH/2, CANVAS_HEIGHT/2); ctx.lineTo(x, CANVAS_HEIGHT); ctx.moveTo(CANVAS_WIDTH/2, CANVAS_HEIGHT/2); ctx.lineTo(x, 0); }
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 4; ctx.setLineDash([20, 20]);
            ctx.beginPath(); ctx.moveTo(CANVAS_WIDTH / 2, 0); ctx.lineTo(CANVAS_WIDTH / 2, CANVAS_HEIGHT); ctx.stroke();
            ctx.setLineDash([]); ctx.beginPath(); ctx.arc(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, 80, 0, Math.PI*2); ctx.stroke();

            const pGoal = ctx.createLinearGradient(0, 0, 100, 0); pGoal.addColorStop(0, 'rgba(14, 165, 233, 0.2)'); pGoal.addColorStop(1, 'rgba(14, 165, 233, 0)');
            ctx.fillStyle = pGoal; ctx.fillRect(0, 0, 100, CANVAS_HEIGHT);
            const aGoal = ctx.createLinearGradient(CANVAS_WIDTH, 0, CANVAS_WIDTH - 100, 0); aGoal.addColorStop(0, 'rgba(236, 72, 153, 0.2)'); aGoal.addColorStop(1, 'rgba(236, 72, 153, 0)');
            ctx.fillStyle = aGoal; ctx.fillRect(CANVAS_WIDTH - 100, 0, 100, CANVAS_HEIGHT);

            rings.forEach(r => r.draw(ctx)); player.draw(ctx); ai.draw(ctx); disc.draw(ctx); particles.forEach(p => p.draw(ctx));

            if (screenShake > 10) {
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = 'rgba(255, 0, 0, 0.1)'; ctx.fillRect(-5, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = 'rgba(0, 255, 255, 0.1)'; ctx.fillRect(5, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.globalCompositeOperation = 'source-over';
            }
            ctx.restore();
        }

        function loop(timestamp) {
            if (gameState === 'playing') {
                const dt = timestamp - lastTime;
                lastTime = timestamp;
                update(dt);
                draw();
            }
            animationId = requestAnimationFrame(loop);
        }

        function startGame() {
            pScore = 0; aScore = 0;
            document.getElementById('player-score-el').innerText = '0';
            document.getElementById('ai-score-el').innerText = '0';
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            gameState = 'playing';
            audio.init(); audio.startMusic();
            lastTime = performance.now();
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('rematch-btn').addEventListener('click', startGame);
        
        document.getElementById('mute-btn').addEventListener('click', () => {
            const isMuted = audio.toggleMute();
            document.getElementById('icon-vol-on').classList.toggle('hidden', isMuted);
            document.getElementById('icon-vol-off').classList.toggle('hidden', !isMuted);
        });

        // Start initial render loop (for background)
        animationId = requestAnimationFrame(loop);
        draw(); // Initial draw for menu background
    </script>
</body>
</html>
